[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hymical-forms"
dynamic = ["version"]
description = "Reliable form ingestion and webhook delivery for developers."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Hymical" }]
keywords = ["forms", "webhooks", "ingestion", "fastapi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
]
dependencies = [
    "fastapi>=0.115",
    "httpx2>=2.0",  # outbound webhook client, and the transport starlette's TestClient uses
    "psycopg[binary]>=3.1",  # PostgreSQL driver for the intended production database
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.11",
    "pytest>=8.3",
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/hymical/forms"
Source = "https://github.com/hymical/forms"
Issues = "https://github.com/hymical/forms/issues"

[tool.hatch.version]
path = "src/hymical_forms/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/hymical_forms"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # import sorting
    "UP",   # pyupgrade
    "B",    # bugbear
    "SIM",  # simplify
    "RUF",  # ruff-specific
]

[tool.mypy]
python_version = "3.11"
files = ["src", "tests"]
strict = true
# Teaches mypy that a BaseSettings subclass can be constructed with no arguments
# because its values come from the environment.
plugins = ["pydantic.mypy"]
